name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema lint
        run: pnpm schema:lint
      - name: Schema breaking-change check (against the base branch)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          cd libs/events && npx buf breaking --against "../../.git#ref=origin/${{ github.base_ref }},subdir=libs/events"
      - run: pnpm generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest # Docker is preinstalled, which Testcontainers needs
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and wait until healthy
        run: docker compose up --wait --wait-timeout 180
      - name: Topics and schema exist
        run: |
          docker compose exec -T redpanda rpk topic list | grep -q 'seats.held'
          curl -fsS http://localhost:18081/subjects | grep -q 'gatepass.events.v1.EventEnvelope'
      - name: Each service database exists and is isolated
        run: |
          docker compose exec -T postgres psql -U postgres -tAc "select datname from pg_database" | grep -q '^seat_inventory$'
          ! docker compose exec -T -e PGPASSWORD=booking_dev postgres psql -U booking -h localhost -d catalog -c 'select 1'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
