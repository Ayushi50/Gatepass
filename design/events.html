<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatepass: shows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/gatepass.css">
<style>
.intro{padding:56px 48px 0}
.intro h1{margin:18px 0 28px;font-size:clamp(48px,6.9vw,88px);line-height:.95;letter-spacing:-.035em}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.shows{padding:40px 48px 72px}
.shows ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.shows li{border-bottom:1px solid var(--line)}
.show{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px;padding:28px 0;color:var(--text);text-decoration:none}
.show .date{width:84px;flex:none;text-align:center}
.show .day{font-family:var(--font-display);font-size:52px;line-height:1}
.show .month{margin-top:4px;font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--muted)}
.show .info{flex:1 1 360px;min-width:0}
.show h2{margin:0 0 6px;font-size:44px;line-height:1.05;letter-spacing:-.025em}
.show .meta{margin:0;font-size:15px;color:var(--muted)}
.show .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:150px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;display:inline-block}
.status .fast{background:var(--amber);box-shadow:0 0 10px rgba(255,179,71,.7)}
.status .ok{border:1.5px solid var(--muted)}
.show .arrow{transition:transform .15s ease}
a.show:hover h2{color:var(--amber)}
a.show:hover .arrow{transform:translateX(6px)}
.show.sold{opacity:.55}
.sold-badge{font-size:13px;font-weight:600;border:1px solid var(--outline);padding:6px 14px;border-radius:999px}
</style>
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html"><span>gatepass</span><i aria-hidden="true"></i></a>
  <nav class="nav" aria-label="Main">
    <a href="events.html" aria-current="page">Shows</a>
    <a href="index.html#how">How it works</a>
    <a href="organizer.html">Host a show</a>
    <a class="outline" href="tickets.html">My tickets</a>
  </nav>
</header>

<main>
  <section class="intro">
    <p class="kicker">Now on sale</p>
    <h1>What is <span class="italic accent">on.</span></h1>
    <div class="filters" role="group" aria-label="Filter shows by type" id="filters"></div>
  </section>
  <section class="shows" aria-live="polite">
    <ul id="show-list"></ul>
  </section>
</main>

<script>
  // BACKEND: replace SHOWS with GET /api/events (availability comes from the seat-inventory read model).
  var SHOWS = [
    { id: 'neon-nights', day: '06', month: 'DEC', title: 'Neon Nights Live', meta: 'Music · 7:30 PM · Open Air Arena', cat: 'Music', status: 'Selling fast', price: 'From ₹1,200', kind: 'fast' },
    { id: 'laugh-lab', day: '13', month: 'DEC', title: 'The Laugh Lab', meta: 'Comedy · 8:00 PM · Studio Theatre', cat: 'Comedy', status: 'Seats available', price: 'From ₹600', kind: 'ok' },
    { id: 'campus-fest', day: '14', month: 'DEC', title: 'Campus Fest Finale', meta: 'Festival · 5:00 PM · College Grounds', cat: 'Festivals', status: 'Seats available', price: 'From ₹499', kind: 'ok' },
    { id: 'jazz-roof', day: '20', month: 'DEC', title: 'Jazz on the Roof', meta: 'Music · 9:15 PM · Skyline Terrace', cat: 'Music', status: 'Sold out', price: '', kind: 'out' },
    { id: 'midnight-market', day: '27', month: 'DEC', title: 'Midnight Market', meta: 'Festival · 10:00 PM · Old Mill Yard', cat: 'Festivals', status: 'Seats available', price: 'From ₹350', kind: 'ok' }
  ];
  var CATEGORIES = ['All', 'Music', 'Comedy', 'Festivals'];
  var filter = 'All';

  function renderFilters() {
    var el = document.getElementById('filters');
    el.innerHTML = CATEGORIES.map(function (c) {
      return '<button type="button" class="pill" data-cat="' + c + '" aria-pressed="' + (c === filter) + '">' + c + '</button>';
    }).join('');
    el.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { filter = b.dataset.cat; renderFilters(); renderShows(); });
    });
  }

  function renderShows() {
    var list = SHOWS.filter(function (s) { return filter === 'All' || s.cat === filter; });
    document.getElementById('show-list').innerHTML = list.map(function (s) {
      var date = '<div class="date"><div class="day">' + s.day + '</div><div class="month">' + s.month + '</div></div>';
      var info = '<div class="info"><h2>' + s.title + '</h2><p class="meta">' + s.meta + '</p></div>';
      if (s.kind === 'out') {
        return '<li><div class="show sold">' + date + info + '<div class="side"><span class="sold-badge">Sold out</span></div><div style="width:28px"></div></div></li>';
      }
      var dot = s.kind === 'fast' ? 'fast' : 'ok';
      return '<li><a class="show" href="seats.html?event=' + s.id + '">' + date + info +
        '<div class="side"><span class="status"><i class="' + dot + '" aria-hidden="true"></i>' + s.status + '</span><span class="muted" style="font-size:14px">' + s.price + '</span></div>' +
        '<svg class="arrow" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 14h18M16 7l7 7-7 7" stroke="#FFB347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>';
    }).join('');
  }

  renderFilters();
  renderShows();
</script>
</body>
</html>
