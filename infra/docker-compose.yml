name: gatepass

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - '19092:19092' # Kafka API for tools on the host
      - '18081:18081' # Schema registry for tools on the host
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # One-shot: creates topics, sets BACKWARD compatibility and registers the event schema.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/bash', '/init/init.sh']
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY: redpanda:8081
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
    volumes:
      - ./redpanda/init.sh:/init/init.sh:ro
      - ./redpanda/topics.txt:/init/topics.txt:ro
      - ../libs/events/proto/gatepass/events/v1/events.proto:/init/events.proto:ro

  # One server, one database + one login role per service. Roles cannot connect to each other's
  # database (see postgres/init/01-databases.sh), so services cannot read each other's data.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-gatepass_admin_dev}
      PG_CATALOG_PASSWORD: ${PG_CATALOG_PASSWORD:-catalog_dev}
      PG_BOOKING_PASSWORD: ${PG_BOOKING_PASSWORD:-booking_dev}
      PG_SEAT_INVENTORY_PASSWORD: ${PG_SEAT_INVENTORY_PASSWORD:-seat_inventory_dev}
      PG_PAYMENT_PASSWORD: ${PG_PAYMENT_PASSWORD:-payment_dev}
      PG_TICKET_PASSWORD: ${PG_TICKET_PASSWORD:-ticket_dev}
      PG_NOTIFICATION_PASSWORD: ${PG_NOTIFICATION_PASSWORD:-notification_dev}
      PG_ANALYTICS_PASSWORD: ${PG_ANALYTICS_PASSWORD:-analytics_dev}
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

volumes:
  redpanda-data:
  postgres-data:
  redis-data:
